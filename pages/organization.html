<script>
// ── Organization Page Logic ──
let orgCompanies = [];
let orgBranches = [];
let orgDepartments = [];
let orgPositions = [];

// ── Permission helpers ──
function canAddOrg() { return window.hasPerm && window.hasPerm('organization', 'add'); }
function canEditOrg() { return window.hasPerm && window.hasPerm('organization', 'edit'); }
function canDeleteOrg() { return window.hasPerm && window.hasPerm('organization', 'delete'); }

function applyOrgPermissions() {
    const addBranch = document.getElementById('btn-add-branch');
    const addDept = document.getElementById('btn-add-dept');
    const addPos = document.getElementById('btn-add-position');
    if (!canAddOrg()) {
        if (addBranch) addBranch.style.display = 'none';
        if (addDept) addDept.style.display = 'none';
        if (addPos) addPos.style.display = 'none';
    }
}

// ── Tab switching ──
function switchTab(tab) {
    const tabs = ['branches', 'departments', 'positions'];
    tabs.forEach(t => {
        const content = document.getElementById(`tab-content-${t}`);
        const tabBtn = document.getElementById(`tab-${t}`);
        if (t === tab) {
            content.classList.remove('hidden');
            tabBtn.classList.add('border-indigo-500', 'text-indigo-600', 'bg-indigo-50/50');
            tabBtn.classList.remove('border-transparent', 'text-slate-500');
        } else {
            content.classList.add('hidden');
            tabBtn.classList.remove('border-indigo-500', 'text-indigo-600', 'bg-indigo-50/50');
            tabBtn.classList.add('border-transparent', 'text-slate-500');
        }
    });
}

// ── Load companies for dropdowns ──
async function loadOrgCompanies() {
    const { data, error } = await window.db.from('companies').select('*');
    if (error) { console.error('Failed to load companies', error); return; }
    orgCompanies = data || [];
    populateCompanyDropdowns();
}

function populateCompanyDropdowns() {
    const dropdowns = ['branch-company', 'dept-company', 'position-company'];
    dropdowns.forEach(id => {
        const sel = document.getElementById(id);
        if (!sel) return;
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">اختر المنشأة</option>';
        orgCompanies.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            sel.appendChild(opt);
        });
        sel.value = currentVal;
    });
}

// ── Load branches ──
async function loadBranches() {
    const tbody = document.getElementById('branches-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>';
    const { data, error } = await apiRequest('GET', '/organization/branches');
    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500">${error.message}</td></tr>`; return; }
    orgBranches = data || [];
    renderBranches();
}

function renderBranches() {
    const tbody = document.getElementById('branches-tbody');
    if (!orgBranches || orgBranches.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">لا توجد فروع بعد</td></tr>';
        return;
    }
    tbody.innerHTML = orgBranches.map(b => `
        <tr class="hover:bg-slate-50">
            <td class="p-4 font-medium text-slate-800">${escapeHtml(b.name)}</td>
            <td class="p-4 text-slate-500">${escapeHtml(b.code || '—')}</td>
            <td class="p-4 text-slate-600">${escapeHtml(b.company_name || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(b.address || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(b.phone || '—')}</td>
            <td class="p-4 text-center">
                ${canEditOrg() ? `<button onclick="editBranch('${b.id}')" class="text-sky-600 hover:text-sky-800 ml-2"><i class="fa-solid fa-pen"></i></button>` : ''}
                ${canDeleteOrg() ? `<button onclick="deleteBranch('${b.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>` : ''}
            </td>
        </tr>
    `).join('');
}

// ── Branch modal ──
function openBranchModal() {
    document.getElementById('branch-modal').classList.remove('hidden');
    document.getElementById('branch-modal').classList.add('flex');
    document.getElementById('branch-modal-title').textContent = 'إضافة فرع';
    document.getElementById('branch-form').reset();
    document.getElementById('branch-id').value = '';
}
function closeBranchModal() {
    document.getElementById('branch-modal').classList.add('hidden');
    document.getElementById('branch-modal').classList.remove('flex');
}
function editBranch(id) {
    const b = orgBranches.find(x => x.id === id);
    if (!b) return;
    document.getElementById('branch-modal').classList.remove('hidden');
    document.getElementById('branch-modal').classList.add('flex');
    document.getElementById('branch-modal-title').textContent = 'تعديل فرع';
    document.getElementById('branch-id').value = b.id;
    document.getElementById('branch-company').value = b.company_id;
    document.getElementById('branch-name').value = b.name;
    document.getElementById('branch-code').value = b.code || '';
    document.getElementById('branch-address').value = b.address || '';
    document.getElementById('branch-phone').value = b.phone || '';
}
async function deleteBranch(id) {
    if (!confirm('هل أنت متأكد من حذف هذا الفرع؟')) return;
    const { error } = await apiRequest('DELETE', `/organization/branches/${id}`);
    if (error) { alert('خطأ: ' + error.message); return; }
    await loadBranches();
}
document.getElementById('branch-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('branch-id').value;
    const payload = {
        name: document.getElementById('branch-name').value,
        code: document.getElementById('branch-code').value || null,
        address: document.getElementById('branch-address').value || null,
        phone: document.getElementById('branch-phone').value || null,
        company_id: document.getElementById('branch-company').value,
    };
    if (!payload.company_id) { alert('المنشأة مطلوبة'); return; }
    const method = id ? 'PUT' : 'POST';
    const path = id ? `/organization/branches/${id}` : '/organization/branches';
    const { error } = await apiRequest(method, path, payload);
    if (error) { alert('خطأ: ' + error.message); return; }
    closeBranchModal();
    await loadBranches();
});

// ── Load departments ──
async function loadDepartments() {
    const tbody = document.getElementById('departments-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>';
    const { data, error } = await apiRequest('GET', '/organization/departments');
    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500">${error.message}</td></tr>`; return; }
    orgDepartments = data || [];
    renderDepartments();
}
function renderDepartments() {
    const tbody = document.getElementById('departments-tbody');
    if (!orgDepartments || orgDepartments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">لا توجد أقسام بعد</td></tr>';
        return;
    }
    tbody.innerHTML = orgDepartments.map(d => `
        <tr class="hover:bg-slate-50">
            <td class="p-4 font-medium text-slate-800">${escapeHtml(d.name)}</td>
            <td class="p-4 text-slate-500">${escapeHtml(d.code || '—')}</td>
            <td class="p-4 text-slate-600">${escapeHtml(d.company_name || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(d.branch_name || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(d.parent_name || '—')}</td>
            <td class="p-4 text-center">
                ${canEditOrg() ? `<button onclick="editDept('${d.id}')" class="text-sky-600 hover:text-sky-800 ml-2"><i class="fa-solid fa-pen"></i></button>` : ''}
                ${canDeleteOrg() ? `<button onclick="deleteDept('${d.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>` : ''}
            </td>
        </tr>
    `).join('');
}

// ── Department modal ──
function openDeptModal() {
    document.getElementById('dept-modal').classList.remove('hidden');
    document.getElementById('dept-modal').classList.add('flex');
    document.getElementById('dept-modal-title').textContent = 'إضافة قسم';
    document.getElementById('dept-form').reset();
    document.getElementById('dept-id').value = '';
    updateDeptBranchOptions();
    updateDeptParentOptions();
}
function closeDeptModal() {
    document.getElementById('dept-modal').classList.add('hidden');
    document.getElementById('dept-modal').classList.remove('flex');
}
function editDept(id) {
    const d = orgDepartments.find(x => x.id === id);
    if (!d) return;
    document.getElementById('dept-modal').classList.remove('hidden');
    document.getElementById('dept-modal').classList.add('flex');
    document.getElementById('dept-modal-title').textContent = 'تعديل قسم';
    document.getElementById('dept-id').value = d.id;
    document.getElementById('dept-company').value = d.company_id;
    updateDeptBranchOptions();
    updateDeptParentOptions();
    document.getElementById('dept-branch').value = d.branch_id || '';
    document.getElementById('dept-parent').value = d.parent_id || '';
    document.getElementById('dept-name').value = d.name;
    document.getElementById('dept-code').value = d.code || '';
}
async function deleteDept(id) {
    if (!confirm('هل أنت متأكد من حذف هذا القسم؟')) return;
    const { error } = await apiRequest('DELETE', `/organization/departments/${id}`);
    if (error) { alert('خطأ: ' + error.message); return; }
    await loadDepartments();
}
function updateDeptBranchOptions() {
    const sel = document.getElementById('dept-branch');
    const companyId = document.getElementById('dept-company').value;
    sel.innerHTML = '<option value="">— بدون فرع —</option>';

// ── Load positions ──
async function loadPositions() {
    const tbody = document.getElementById('positions-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i></td></tr>';
    const { data, error } = await apiRequest('GET', '/organization/job-positions');
    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-rose-500">${error.message}</td></tr>`; return; }
    orgPositions = data || [];
    renderPositions();
}
function renderPositions() {
    const tbody = document.getElementById('positions-tbody');
    if (!orgPositions || orgPositions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-slate-400">لا توجد مسميات وظيفية بعد</td></tr>';
        return;
    }
    tbody.innerHTML = orgPositions.map(p => `
        <tr class="hover:bg-slate-50">
            <td class="p-4 font-medium text-slate-800">${escapeHtml(p.title)}</td>
            <td class="p-4 text-slate-500">${escapeHtml(p.code || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(p.grade || '—')}</td>
            <td class="p-4 text-slate-600">${escapeHtml(p.company_name || '—')}</td>
            <td class="p-4 text-slate-500">${escapeHtml(p.department_name || '—')}</td>
            <td class="p-4 text-center">
                ${canEditOrg() ? `<button onclick="editPosition('${p.id}')" class="text-sky-600 hover:text-sky-800 ml-2"><i class="fa-solid fa-pen"></i></button>` : ''}
                ${canDeleteOrg() ? `<button onclick="deletePosition('${p.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>` : ''}
            </td>
        </tr>
    `).join('');
}

// ── HTML escape helper ──
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── Direct API helper (bypasses apiClient table alias resolution) ──
async function apiRequest(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('hr_auth_token');
    if (token) headers['Authorization'] = `Bearer ${token}`;
    try {
        const res = await fetch(`${window.API_BASE_URL}${path}`, {
            method, headers,
            body: body ? JSON.stringify(body) : undefined,
            cache: 'no-store',
        });
        const text = await res.text();
        let json = null;
        try { json = JSON.parse(text); } catch (_) {}
        if (!res.ok) return { data: null, error: { message: json?.error || text || `HTTP ${res.status}` } };
        return { data: json?.data || json, error: null };
    } catch (err) {
        return { data: null, error: { message: err.message } };
    }
}
